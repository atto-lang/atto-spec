name: Functor ADT source-free model
on:
  pull_request:
    paths:
      - 'spec/23-functors-and-nested-adts.md'
      - 'spec/02-types-and-patterns.md'
      - 'tests/functor-adt-model.test.mjs'
      - '.github/workflows/functor-adt-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run reference model (NOT guest/AOT evidence)
        run: node --test tests/functor-adt-model.test.mjs
