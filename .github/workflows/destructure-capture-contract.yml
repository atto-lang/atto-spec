name: Destructure capture contract (reference only)
on:
  push:
    branches: ['spec/destructure-capture-binding-policy-v1-20261127']
  pull_request:
    paths: ['language/destructure-capture-v1.md','conformance/destructure-capture-v1.json','tests/destructure-capture-contract.test.mjs']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: node --test tests/destructure-capture-contract.test.mjs
