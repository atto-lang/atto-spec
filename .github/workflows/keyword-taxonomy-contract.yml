name: AttoLang keyword taxonomy contract
on:
  push:
    paths:
      - 'contracts/keyword-taxonomy-v1/**'
      - 'spec/04-ownership-and-memory.md'
      - 'spec/16-lexical-and-grammar-reference.md'
      - 'spec/23-keyword-taxonomy-and-highlighting.md'
      - 'language/ownership-vocabulary-v1.md'
      - 'tests/ownership-bang-canonical.test.mjs'
      - 'spec/23-keyword-taxonomy-and-highlighting.md'
      - 'tests/keyword-taxonomy-contract.test.mjs'
      - 'tests/keyword-taxonomy-lexical-model.test.mjs'
      - 'tests/fixtures/keyword-taxonomy-lexical-v1.json'
      - 'tests/helpers/keyword-taxonomy-lexical-reference.mjs'
      - '.github/workflows/keyword-taxonomy-contract.yml'
  pull_request:
    paths:
      - 'contracts/keyword-taxonomy-v1/**'
      - 'spec/04-ownership-and-memory.md'
      - 'spec/16-lexical-and-grammar-reference.md'
      - 'spec/23-keyword-taxonomy-and-highlighting.md'
      - 'language/ownership-vocabulary-v1.md'
      - 'tests/ownership-bang-canonical.test.mjs'
      - 'spec/23-keyword-taxonomy-and-highlighting.md'
      - 'tests/keyword-taxonomy-contract.test.mjs'
      - 'tests/keyword-taxonomy-lexical-model.test.mjs'
      - 'tests/fixtures/keyword-taxonomy-lexical-v1.json'
      - 'tests/helpers/keyword-taxonomy-lexical-reference.mjs'
      - '.github/workflows/keyword-taxonomy-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  taxonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate staged taxonomy metadata (source-only, not backend parity)
        run: node --test tests/keyword-taxonomy-contract.test.mjs tests/keyword-taxonomy-lexical-model.test.mjs tests/ownership-bang-canonical.test.mjs
