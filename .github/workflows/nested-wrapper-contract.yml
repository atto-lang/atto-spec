name: Nested wrapper normative-rule tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact PR head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Run source-free normative typing oracle
        run: node --test tests/nested-wrapper-contract.test.mjs
