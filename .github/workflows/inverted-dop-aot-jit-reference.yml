name: Inverted DOP AOT-JIT reference oracle (source-only)
on:
  pull_request:
    paths:
      - 'spec/10-dop-and-realtime.md'
      - 'spec/27-inverted-structs-classes-aot-jit.md'
      - 'tests/inverted-dop-aot-jit-reference.test.mjs'
      - '.github/workflows/inverted-dop-aot-jit-reference.yml'
  push:
    branches: [main]
    paths:
      - 'spec/10-dop-and-realtime.md'
      - 'spec/27-inverted-structs-classes-aot-jit.md'
      - 'tests/inverted-dop-aot-jit-reference.test.mjs'
      - '.github/workflows/inverted-dop-aot-jit-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "SOURCE_ONLY_EXACT_HEAD=$EXPECTED_HEAD"
          echo "SOURCE_ONLY_EXACT_TREE=$(git rev-parse HEAD^{tree})"
      - name: Execute source-free ownership and JIT-guard model
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/inverted-dop-aot-jit-reference.test.mjs
          echo 'REFERENCE_MODEL_ONLY; AttoLang guest compiler/AOT/JIT NOT_EXECUTED'
