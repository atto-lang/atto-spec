name: Atto zero-step CI admission watch

on:
  schedule:
    - cron: '40 19 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact source-repository Actions run ID (omit for recent bounded scan)
        type: string
        required: false
        default: ''

# Source repo's own token, Actions read only. No compiler checkout, secrets,
# cross-organization private-source transfer, status writes or auto-merging.
permissions:
  actions: read
  contents: read
jobs:
  report-admission:
    uses: atto-lang/.github/.github/workflows/ci-zero-step-watcher.yml@e934ffd39781a7642e2bc1a0d9d4fa893e866091
    permissions:
      actions: read
      contents: read
    with:
      run_id: ${{ inputs.run_id || '' }}
