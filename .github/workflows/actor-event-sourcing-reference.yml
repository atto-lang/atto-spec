name: Atto event-sourcing contract reference (host only)
on:
  pull_request:
    paths:
      - 'language/actor-event-sourcing-v1.md'
      - 'conformance/actor-event-sourcing-v1.json'
      - 'conformance/actor-event-sourced-declaration-v1.atto'
      - 'tests/actor-event-sourcing-reference.test.mjs'
      - '.github/workflows/actor-event-sourcing-reference.yml'
  push:
    paths:
      - 'language/actor-event-sourcing-v1.md'
      - 'conformance/actor-event-sourcing-v1.json'
      - 'conformance/actor-event-sourced-declaration-v1.atto'
      - 'tests/actor-event-sourcing-reference.test.mjs'
      - '.github/workflows/actor-event-sourcing-reference.yml'
permissions:
  contents: read
jobs:
  reference-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/actor-event-sourcing-reference.test.mjs
      - run: echo 'HOST_ONLY - no Atto compiler, guest, event-store or SQLite journal was executed'
