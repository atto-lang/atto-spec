name: Actor spawn-effect contract (host only)
on:
  pull_request:
    paths:
      - 'language/actor-spawns-effect-v1.md'
      - 'contracts/actor-spawns-effect-v1.json'
      - 'tests/actor-spawns-effect-contract.test.mjs'
      - '.github/workflows/actor-spawns-effect-contract.yml'
  push:
    paths:
      - 'language/actor-spawns-effect-v1.md'
      - 'contracts/actor-spawns-effect-v1.json'
      - 'tests/actor-spawns-effect-contract.test.mjs'
      - '.github/workflows/actor-spawns-effect-contract.yml'
permissions:
  contents: read
jobs:
  source-free-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Run source-free reference model (NOT compiled AttoLang conformance)
        run: node --test tests/actor-spawns-effect-contract.test.mjs
