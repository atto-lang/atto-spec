name: Deterministic actor schedule source-free oracle

on:
  pull_request:
    paths:
      - 'proposals/deterministic-actor-execution-v1.md'
      - 'scripts/deterministic-actor-model.mjs'
      - 'tests/deterministic-actor-model.test.mjs'
      - '.github/workflows/deterministic-actor-model.yml'
  push:
    branches: [main]
    paths:
      - 'proposals/deterministic-actor-execution-v1.md'
      - 'scripts/deterministic-actor-model.mjs'
      - 'tests/deterministic-actor-model.test.mjs'
      - '.github/workflows/deterministic-actor-model.yml'

permissions:
  contents: read

jobs:
  host-reference-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify source-free deterministic scheduling reference (NOT guest execution)
        run: node --test tests/deterministic-actor-model.test.mjs
