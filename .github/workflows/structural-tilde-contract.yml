name: Structural tilde source-free contract integrity
on:
  pull_request:
    paths:
      - "language/structural-tilde-v1.md"
      - "language/anonymous-structural-shapes-v1.md"
      - "tests/anonymous-structural-shapes-reference.test.mjs"
      - "tests/anonymous-structural-shape-contract.test.mjs"
      - "conformance/anonymous-structural-shapes-v1.json"
      - "conformance/structural-tilde-v1.json"
      - "tests/structural-tilde-contract.test.mjs"
      - "language/match-arm-delimiters-v1.md"
      - "conformance/match-arm-delimiters-v1.json"
      - "tests/match-arm-delimiters-contract.test.mjs"
      - "tests/structural-pattern-semantics-reference.test.mjs"
      - ".github/workflows/structural-tilde-contract.yml"
  push:
    paths:
      - "language/structural-tilde-v1.md"
      - "language/anonymous-structural-shapes-v1.md"
      - "tests/anonymous-structural-shapes-reference.test.mjs"
      - "tests/anonymous-structural-shape-contract.test.mjs"
      - "conformance/anonymous-structural-shapes-v1.json"
      - "conformance/structural-tilde-v1.json"
      - "tests/structural-tilde-contract.test.mjs"
      - "language/match-arm-delimiters-v1.md"
      - "conformance/match-arm-delimiters-v1.json"
      - "tests/match-arm-delimiters-contract.test.mjs"
      - "tests/structural-pattern-semantics-reference.test.mjs"
      - ".github/workflows/structural-tilde-contract.yml"
jobs:
  schema-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check fixture integrity (NOT guest compilation)
        run: node --test tests/structural-tilde-contract.test.mjs tests/match-arm-delimiters-contract.test.mjs tests/structural-pattern-semantics-reference.test.mjs tests/anonymous-structural-shapes-reference.test.mjs tests/anonymous-structural-shape-contract.test.mjs
