name: Full-AOT feature ledger schema (host only)
on:
  pull_request:
    paths:
      - 'language/full-aot-feature-coverage-v1.md'
      - 'conformance/full-aot-feature-coverage-v1.json'
      - 'tests/test_full_aot_*.py'
      - '.github/workflows/full-aot-feature-coverage.yml'
  push:
    paths:
      - 'language/full-aot-feature-coverage-v1.md'
      - 'conformance/full-aot-feature-coverage-v1.json'
      - 'tests/test_full_aot_*.py'
      - '.github/workflows/full-aot-feature-coverage.yml'
permissions:
  contents: read
jobs:
  ledger-schema-host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check ledger JSON, coverage and evidence requirements (NOT guest parity)
        run: |
          python3 --version
          python3 -m unittest discover -s tests -p 'test_full_aot_*.py' -v
