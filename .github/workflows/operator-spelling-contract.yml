name: Atto operator spelling source-contract checks
on:
  push:
    paths:
      - 'language/bitwise-and-stream-operators-v1.md'
      - 'contracts/operator-spelling/v1/cases.json'
      - 'contracts/top-level-defines/v1/cases.json'
      - 'tests/operator-spelling.test.mjs'
      - 'tests/top-level-defines.test.mjs'
      - '.github/workflows/operator-spelling-contract.yml'
  pull_request:
    paths:
      - 'language/bitwise-and-stream-operators-v1.md'
      - 'contracts/operator-spelling/v1/cases.json'
      - 'contracts/top-level-defines/v1/cases.json'
      - 'tests/operator-spelling.test.mjs'
      - 'tests/top-level-defines.test.mjs'
      - '.github/workflows/operator-spelling-contract.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head and tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          printf "head=%s\ntree=%s\n" "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Parse and validate source-contract fixtures
        run: |
          node --check tests/operator-spelling.test.mjs
          node --check tests/top-level-defines.test.mjs
          node --test tests/operator-spelling.test.mjs tests/top-level-defines.test.mjs
