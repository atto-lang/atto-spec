name: Durable typed protocols v1 (host reference only)
on:
  pull_request:
    paths:
      - 'language/durable-typed-protocols-v1.md'
      - 'conformance/durable-typed-protocols-v1.json'
      - 'tests/durable-typed-protocols-reference.test.mjs'
      - '.github/workflows/durable-typed-protocols-reference.yml'
  push:
    paths:
      - 'language/durable-typed-protocols-v1.md'
      - 'conformance/durable-typed-protocols-v1.json'
      - 'tests/durable-typed-protocols-reference.test.mjs'
      - '.github/workflows/durable-typed-protocols-reference.yml'
permissions:
  contents: read
jobs:
  host-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/durable-typed-protocols-reference.test.mjs
      - run: echo 'HOST_MODEL_ONLY; no Atto compiler, SQLite, fsync, SIGKILL or backend tested'
