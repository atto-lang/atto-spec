name: Inherited field aliases (source-only contract)
on:
  pull_request:
    paths:
      - 'language/inherited-field-aliases-v1.md'
      - 'conformance/inherited-field-aliases-v1.json'
      - 'tests/inherited-field-aliases-contract.test.mjs'
      - '.github/workflows/inherited-field-aliases-contract.yml'
  push:
    branches: ['ci/**']
permissions:
  contents: read
jobs:
  validate_registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run source-only registry tests (not compiler execution)
        run: |
          node --version
          node --test tests/inherited-field-aliases-contract.test.mjs
