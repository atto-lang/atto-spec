name: Runtime single-threaded mode contract (source-free)
on:
  pull_request:
    paths:
      - 'contracts/runtime-threading-v1.json'
      - 'language/runtime-threading-mode-v1.md'
      - 'tests/runtime-threading-contract.test.mjs'
      - '.github/workflows/runtime-threading-contract.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/runtime-threading-v1.json'
      - 'language/runtime-threading-mode-v1.md'
      - 'tests/runtime-threading-contract.test.mjs'
      - '.github/workflows/runtime-threading-contract.yml'
permissions:
  contents: read
jobs:
  source-free-reference-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out source commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test SOURCE-FREE CLI policy model (not a compiled guest)
        run: node --test tests/runtime-threading-contract.test.mjs
