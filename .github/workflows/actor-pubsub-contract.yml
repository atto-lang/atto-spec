name: Actor pubsub source-free contract
on:
  pull_request:
    paths:
      - 'language/actor-pubsub-v1.md'
      - 'contracts/actor-pubsub-v1/**'
      - 'tests/actor-pubsub-contract.test.mjs'
      - '.github/workflows/actor-pubsub-contract.yml'
  push:
    branches: [main]
    paths:
      - 'language/actor-pubsub-v1.md'
      - 'contracts/actor-pubsub-v1/**'
      - 'tests/actor-pubsub-contract.test.mjs'
      - '.github/workflows/actor-pubsub-contract.yml'
permissions:
  contents: read
jobs:
  source-free-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out SHA
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run source-free reference checks (NOT guest parity)
        run: node --test tests/actor-pubsub-contract.test.mjs
