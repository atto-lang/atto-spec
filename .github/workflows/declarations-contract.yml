name: Top-level declaration contract structural audit
on:
  pull_request:
    paths: ['contracts/top-level-defines/**','proposals/top-level-defines-v1.md','tests/**','.github/workflows/declarations-contract.yml']
  push:
    paths: ['contracts/top-level-defines/**','proposals/top-level-defines-v1.md','tests/**','.github/workflows/declarations-contract.yml']
permissions:
  contents: read
jobs:
  structural-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Structural contract tests (not guest execution)
        run: node --test tests/top-level-defines.test.mjs
