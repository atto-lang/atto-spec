name: Effects and lifetimes target contract (source only)
on:
  push:
    paths:
      - 'contracts/attolang-effects-lifetimes-v1/**'
      - 'spec/04-ownership-and-memory.md'
      - 'spec/23-effects-and-lifetimes.md'
      - 'tests/effects-lifetimes-contract.test.mjs'
      - '.github/workflows/effects-lifetimes-contract.yml'
  pull_request:
    paths:
      - 'contracts/attolang-effects-lifetimes-v1/**'
      - 'tests/effects-lifetimes-contract.test.mjs'
      - '.github/workflows/effects-lifetimes-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate candidate semantics (NOT guest execution)
        run: node --test tests/effects-lifetimes-contract.test.mjs
