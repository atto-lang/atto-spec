name: Typed pattern-fragment v1 reference (HOST ONLY)
on:
  pull_request:
    paths:
      - 'language/typed-pattern-fragments-v1.md'
      - 'tests/typed-pattern-fragments-v1.test.mjs'
      - '.github/workflows/typed-pattern-fragments-v1.yml'
  push:
    paths:
      - 'language/typed-pattern-fragments-v1.md'
      - 'tests/typed-pattern-fragments-v1.test.mjs'
      - '.github/workflows/typed-pattern-fragments-v1.yml'
permissions:
  contents: read
jobs:
  reference-fragments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run host-only typed pattern-fragment reference tests
        run: |
          node --version
          node --test tests/typed-pattern-fragments-v1.test.mjs
