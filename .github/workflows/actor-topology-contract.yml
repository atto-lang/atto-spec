name: Actor topology host-reference contract
on:
  push:
    paths:
      - 'src/actor-topology-reference.mjs'
      - 'tests/actor-topology-contract.test.mjs'
      - 'language/actor-self-organization-v1.md'
      - '.github/workflows/actor-topology-contract.yml'
  pull_request:
    paths:
      - 'src/actor-topology-reference.mjs'
      - 'tests/actor-topology-contract.test.mjs'
      - 'language/actor-self-organization-v1.md'
      - '.github/workflows/actor-topology-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-reference-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and run host-only bounded reference tests
        run: |
          node --check src/actor-topology-reference.mjs
          node --check tests/actor-topology-contract.test.mjs
          node --test tests/actor-topology-contract.test.mjs
