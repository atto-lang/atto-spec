name: Canonical removed operators (source model only)
on:
  push:
    paths: ['scripts/canonical-operators.mjs', 'tests/canonical-operators.test.mjs', 'contracts/removed-operators-v1/**', '.github/workflows/canonical-operators.yml']
  pull_request:
    paths: ['scripts/canonical-operators.mjs', 'tests/canonical-operators.test.mjs', 'contracts/removed-operators-v1/**', '.github/workflows/canonical-operators.yml']
permissions:
  contents: read
jobs:
  lexical-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate source-only fixture model (NOT a compiler)
        run: node --test tests/canonical-operators.test.mjs
