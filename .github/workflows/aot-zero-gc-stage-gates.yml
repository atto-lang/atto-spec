name: AOT zero-GC stage-oracle contract (source-only)
on:
  pull_request:
    paths:
      - 'contracts/aot-zero-gc-stage-gates-v1.json'
      - 'tests/aot-zero-gc-stage-gates.test.mjs'
      - 'spec/24-aot-zero-gc-controlled-dynamism.md'
      - '.github/workflows/aot-zero-gc-stage-gates.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/aot-zero-gc-stage-gates-v1.json'
      - 'tests/aot-zero-gc-stage-gates.test.mjs'
      - 'spec/24-aot-zero-gc-controlled-dynamism.md'
      - '.github/workflows/aot-zero-gc-stage-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head and clean tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "SOURCE_ONLY_EXACT_HEAD=$EXPECTED_HEAD"
          echo "SOURCE_ONLY_EXACT_TREE=$(git rev-parse HEAD^{tree})"
      - name: Validate AOT stage inventory and negative mutation cases
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/aot-zero-gc-stage-gates.test.mjs
          echo 'AOT_STAGE_INVENTORY_ONLY; compiler/IR/guest tests NOT_EXECUTED'
