name: Atto semantic reconciliation source-contract
on:
  pull_request:
    paths:
      - 'spec/**'
      - 'language/return-first-and-begin-callables-v1.md'
      - 'language/bitwise-and-stream-operators-v1.md'
      - 'language/semantic-reconciliation-2026-11-20.md'
      - 'language/bitwise-backend-status-snapshot-2026-11-20.md'
      - 'README.md'
      - 'tests/semantic-reconciliation-decisions.test.mjs'
      - '.github/workflows/semantic-reconciliation-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable exact head and worktree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git ls-files -s -- tests/semantic-reconciliation-decisions.test.mjs | cut -d' ' -f1)" = "100644"
          for source in \
            README.md \
            language/bitwise-and-stream-operators-v1.md \
            language/semantic-reconciliation-2026-11-20.md \
            language/bitwise-backend-status-snapshot-2026-11-20.md \
            tests/semantic-reconciliation-decisions.test.mjs; do
            test "$(git hash-object --no-filters "$source")" = "$(git rev-parse "HEAD:$source")"
          done
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check and execute source-contract tests
        run: |
          node --check tests/semantic-reconciliation-decisions.test.mjs
          node --test tests/semantic-reconciliation-decisions.test.mjs
