name: Awaitable protocol abstract contract
on:
  pull_request:
    paths: ['rfcs/general-awaitable-poll-protocol.md', 'tests/awaitable-protocol-model.mjs', '.github/workflows/awaitable-protocol-model.yml']
  push:
    branches: [main]
    paths: ['rfcs/general-awaitable-poll-protocol.md', 'tests/awaitable-protocol-model.mjs', '.github/workflows/awaitable-protocol-model.yml']
permissions:
  contents: read
jobs:
  abstract-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node tests/awaitable-protocol-model.mjs
