name: Proposed cooperation contract (source-free)
on:
  pull_request:
    paths:
      - 'contracts/cooperation/**'
      - 'proposals/cooperation-checkpoints-v1.md'
      - 'tests/cooperation-contract.test.mjs'
      - '.github/workflows/cooperation-contract.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/cooperation/**'
      - 'proposals/cooperation-checkpoints-v1.md'
      - 'tests/cooperation-contract.test.mjs'
      - '.github/workflows/cooperation-contract.yml'
permissions:
  contents: read
jobs:
  source-free-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit and tree
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test model (does not certify guest execution)
        run: node --test tests/cooperation-contract.test.mjs
