name: Record and Map literal identity contract (host only)
on:
  pull_request:
    paths:
      - 'language/inline-collection-literals-v1.md'
      - 'language/entry-expression-and-record-literals-v1.md'
      - 'language/map-of-entries-and-nominal-structs-v1.md'
      - 'language/typed-map-of-entries-and-nominal-structs-v1.md'
      - 'tests/parenthesized-record-contract.test.mjs'
      - 'conformance/aggregate-constructor-v2.json'
      - 'language/record-struct-layout-v1.md'
      - 'tests/record-map-literal-contract.test.mjs'
      - '.github/workflows/record-map-literal-contract.yml'
  push:
    paths:
      - 'language/inline-collection-literals-v1.md'
      - 'language/entry-expression-and-record-literals-v1.md'
      - 'language/map-of-entries-and-nominal-structs-v1.md'
      - 'language/typed-map-of-entries-and-nominal-structs-v1.md'
      - 'tests/parenthesized-record-contract.test.mjs'
      - 'conformance/aggregate-constructor-v2.json'
      - 'language/record-struct-layout-v1.md'
      - 'tests/record-map-literal-contract.test.mjs'
      - '.github/workflows/record-map-literal-contract.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run host-only Map/Record classification and document checks
        run: |
          node --version
          node --test tests/record-map-literal-contract.test.mjs tests/parenthesized-record-contract.test.mjs
